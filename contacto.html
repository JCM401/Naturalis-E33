<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto - Naturalis</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:linear-gradient(rgba(10,30,20,0.85), rgba(10,30,20,0.85)),
               url("fondo login.png");
    background-size:cover;
    background-attachment:fixed;
    color:#eafff2;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:rgba(10,30,20,0.8);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
}

.logo img{
    width:45px;
    border-radius:50%;
}

.menu-btn{
    display:none;
    font-size:26px;
    cursor:pointer;
}

nav a{
    margin-left:18px;
    color:#c8ffe1;
    text-decoration:none;
}

/* MAIN */
main{
    max-width:600px;
    margin:80px auto;
    background:rgba(25,55,40,0.8);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:30px;
    box-shadow:0 20px 40px rgba(0,0,0,0.6);
}

main h2{
    text-align:center;
    color:#7dffb3;
    margin-bottom:30px;
}

/* FORM */
form input, form textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:15px;
    border:none;
    outline:none;
}

form textarea{
    resize:none;
    height:120px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:25px;
    font-weight:600;
    cursor:pointer;
    background:linear-gradient(135deg,#e6ffe9,#b8ffd9);
    color:#103020;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* FOOTER */
footer{
    background:rgba(10,30,20,0.9);
    padding:25px;
    text-align:center;
    margin-top:60px;
}

footer a{
    color:#7dffb3;
    text-decoration:none;
}

/* RESPONSIVE */
@media(max-width:768px){
    nav{
        display:none;
        position:absolute;
        top:70px;
        right:20px;
        background:rgba(10,30,20,0.95);
        padding:20px;
        border-radius:15px;
    }

    nav a{
        display:block;
        margin:10px 0;
    }

    .menu-btn{
        display:block;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <img src="logo.jpg">
        NATURALIS
    </div>

    <span class="menu-btn" onclick="toggleMenu()">☰</span>

    <nav id="menu">
        <a href="index.html">Inicio</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="productos.html">Productos</a>
        <a href="tienda.html">Tienda</a>
        <a href="blog.html">Blog</a>
        <a href="reseñas.html">Reseñas</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="carrito.html">Carrito</a>
        <a href="servicios.html">Servicios</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
    <h2>📩 Contáctanos</h2>
    <form id="formContacto">
        <input type="text" name="nombre" placeholder="Tu nombre" required>
        <input type="email" name="correo" placeholder="Tu correo" required>
        <textarea name="mensaje" placeholder="Escribe tu mensaje" required></textarea>
        <button type="submit">Enviar mensaje</button>
    </form>
</main>

<footer>
    <p>© Naturalis 2025 — Todos los derechos reservados</p>
    <p>🌿 Productos ecológicos y sostenibles</p>
</footer>

<script>
function toggleMenu(){
    const menu=document.getElementById("menu");
    menu.style.display=(menu.style.display==="block")?"none":"block";
}

/* EMAILJS */
(function(){
    emailjs.init("juancm8757@gmail.com"); // ← AQUÍ VA TU KEY
})();

document.getElementById("formContacto").addEventListener("submit", function(e){
    e.preventDefault();

    emailjs.sendForm(
        "juancm8757@gmail.com",
        "juancm8757@gmail.com",
        this
    ).then(()=>{
        alert("Mensaje enviado correctamente 🌿");
        this.reset();
    },()=>{
        alert("Error al enviar el mensaje");
    });
});
</script>

</body>
</html>
